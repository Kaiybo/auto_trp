name: checks

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Syntax check
        run: for f in $(find AutoTRP -name '*.lua'); do luac5.1 -p "$f"; done
      - name: Offline test
        run: lua5.1 tests/run.lua
