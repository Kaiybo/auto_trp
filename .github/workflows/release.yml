name: release

# Push a tag like v0.12.0 and this builds AutoTRP-<version>.zip and publishes a GitHub
# release with that version's changelog section as the notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Check
        run: |
          for f in $(find AutoTRP -name '*.lua'); do luac5.1 -p "$f"; done
          lua5.1 tests/run.lua
      - name: Build zip
        id: build
        run: echo "zip=$(python3 tools/build_zip.py)" >> "$GITHUB_OUTPUT"
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; title = substr($0, 4); next } }
            found { print }
          ' CHANGELOG.md > notes.md
          title=$(grep -m1 "^## $version " CHANGELOG.md | sed -E 's/^## [^:]*: //')
          echo "TITLE=Auto TRP $version: $title" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "$TITLE" --notes-file notes.md
